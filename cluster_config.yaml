# Cluster and reviewer configuration for coding-rna auto-research.
# Generated from /configure-project proposal on 2026-06-09 using live Slurm probing.

cluster_name: baobab

# Submission topology (configure-project refresh 2026-06-14, live local probe).
# 当前驱动运行在 baobab login node；本机有 Slurm/conda。训练直接 sbatch/srun，
# 但重计算仍不得在 login 节点裸跑。
submission:
  mode: on_cluster
  ssh_host: null
  remote_project_dir: /home/users/j/jwang/coding-rna
  shared_mount:
    enabled: false
    local_root: /home/users/j/jwang/coding-rna
    remote_root: /home/users/j/jwang/coding-rna
    note: "on_cluster: 当前 shell 已在 baobab；无需 ssh/rsync"
  conda_init: /opt/ebsofts/Mamba/23.1.0-4/etc/profile.d/conda.sh
  conda_env: coding-rna                              # 已存在: /home/users/j/jwang/.conda/envs/coding-rna
  submit_template: "cd /home/users/j/jwang/coding-rna && sbatch {script}"
  poll_template:   "squeue -j {job_id} -h -o %T || sacct -j {job_id} -n -o State%20"
  probe_template:  "sinfo -o \"%P %l %G %D\""
  cancel_template: "scancel {job_id}"
  decision_logic_local: true                         # context_pack/validate_goal 可在 login node 跑
  local_has_slurm: true
  local_has_gpu: false

hard_limits:
  max_concurrent_jobs: 80
  max_concurrent_directions: 30
  max_array_size: 100
  min_vram_gb_default: 20
  always_exclude_nodes: [gpu023, gpu024, gpu036, gpu037, gpu038, gpu039, gpu040, gpu041, gpu042, gpu043]
  require_checkpoint_for_shared_over_12h: true
  require_unique_output_dir: true
  require_unique_sbatch_log_path: true
  require_track_a_orthogonality: true
  orthogonality_policy:
    hard_fail_when:
      - all_candidates_only_vary_in: [lr, batch_size, dropout, seed, scheduler, warmup]
      - two_or_more_candidates_share_same_mechanism_delta
      - candidate_cannot_articulate_structural_change
    soft_warn_when:
      - two_or_more_candidates_share_same_major_axis_but_distinct_mechanism_delta
    allowed_major_axis:
      [head_arch, backbone, objective, data_view, tokenizer, decoder, training_signal,
       loss_design, regularization_design, augmentation_design]
  forbid_claim_from_profiles: [smoke, screen]
  respect_maintenance_reservation: true

preferences:
  prefer_private: true
  prefer_private_when_close: true
  private_bonus_hours: 0
  shared_checkpoint_overhead_hours: 0.25
  default_efficient_min_gpus: 1
  always_exclude_nodes: [gpu023, gpu024, gpu036, gpu037, gpu038, gpu039, gpu040, gpu041, gpu042, gpu043]
  shared_when_private_wait_gt_job_time: true
  maintenance_buffer_seconds: 3600
  short_job_max_hours: 12
  long_job_min_hours_for_private: 24
  queue_wait_estimate_method: squeue_start_time

partitions:
  - name: private-teodoro-gpu
    priority: 1
    nodes: [gpu034, gpu035]
    gpu_type: nvidia_geforce_rtx_3090
    gpus_per_node: 8
    vram_gb: 24
    time_limit_hours: 168
    cost: free
    gpu_types:
      - {name: nvidia_geforce_rtx_3090, vram_gb: 24, count_per_node: 8}
    queue_wait_threshold_hours: 6
    notes: "Live sinfo: private-teodoro-gpu, 7 days, RTX3090 24GB, 2 nodes."

  - name: shared-gpu
    priority: 2
    time_limit_hours: 12
    cost: billed
    high_memory_nodes:
      - {nodes: [gpu027], gpu_type: nvidia_a100_80gb_pcie, gpus_per_node: 1, vram_gb: 80}
      - {nodes: [gpu029], gpu_type: nvidia_a100_80gb_pcie, gpus_per_node: 4, vram_gb: 80}
      - {nodes: [gpu032, gpu033], gpu_type: nvidia_a100_80gb_pcie, gpus_per_node: 3, vram_gb: 80}
      - {nodes: [gpu020, gpu030, gpu031], gpu_type: nvidia_a100-pcie-40gb, gpus_per_node: 4, vram_gb: 40}
      - {nodes: [gpu022], gpu_type: nvidia_a100-pcie-40gb, gpus_per_node: 7, vram_gb: 40}
      - {nodes: [gpu028], gpu_type: nvidia_a100-pcie-40gb, gpus_per_node: 1, vram_gb: 40}
      - {nodes: [gpu045], gpu_type: nvidia_a100_80gb_pcie, gpus_per_node: 2, vram_gb: 80}
      - {nodes: [gpu048], gpu_type: nvidia_rtx_a6000, gpus_per_node: 8, vram_gb: 48}
    standard_24gb_nodes:
      - {nodes: [gpu017, gpu021, gpu025, gpu026, gpu034, gpu035, gpu049], gpu_type: nvidia_geforce_rtx_3090_or_4090, gpus_per_node: 8, vram_gb: 24}
      - {nodes: [gpu044, gpu046, gpu047], gpu_type: nvidia_rtx_a5000_or_a5500, gpus_per_node: 8, vram_gb: 24}
    excluded_nodes: [gpu023, gpu024, gpu036, gpu037, gpu038, gpu039, gpu040, gpu041, gpu042, gpu043]
    ambiguous_nodes: [gpu050]
    gpu_types:
      - {name: nvidia_h100_nvl, vram_gb: 94}
      - {name: nvidia_a100_80gb_pcie, vram_gb: 80}
      - {name: nvidia_a100-pcie-40gb, vram_gb: 40}
      - {name: nvidia_rtx_a6000, vram_gb: 48}
      - {name: nvidia_rtx_pro_4500_blackwell, vram_gb: 32}
      - {name: nvidia_rtx_5000, vram_gb: 32}
      - {name: nvidia_rtx_a5000, vram_gb: 25}
      - {name: nvidia_geforce_rtx_4090, vram_gb: 24}
      - {name: nvidia_geforce_rtx_3090, vram_gb: 24}
      - {name: nvidia_rtx_a5500, vram_gb: 24}
    excluded_by_default:
      - {name: nvidia_geforce_rtx_3080, vram_gb: 10}
      - {name: nvidia_titan_x, vram_gb: 12}
      - {name: tesla_p100-pcie-12gb, vram_gb: 12}
    notes: "Live sinfo: shared-gpu, 12h, heterogeneous GPUs; H100 node names were not resolved from aggregate sinfo. Use only for smoke/screen/short jobs unless checkpoint+resubmit exists."

  - name: shared-cpu
    priority: 10
    time_limit_hours: 12
    cost: billed
    gpu_types: []
    notes: "Auxiliary preprocessing/evaluation only."

  - name: public-cpu
    priority: 11
    time_limit_hours: 96
    cost: public
    gpu_types: []
    notes: "Auxiliary long CPU preprocessing only."

job_class:
  smoke: {max_hours: 1, notes: "pipeline/data/metric sanity only; cannot claim"}
  screen: {max_hours: 12, notes: "Track A architecture screen; cannot claim"}
  full: {max_hours: 72, notes: "claim candidate only after benchmark contract and human gate"}
  scale: {max_hours: 168, notes: "large evidence run; prefer private partition"}

defaults:
  cpus_per_task: 8
  mem_per_gpu_gb: 32
  signal: USR1@120
  conda_env: coding-rna
  conda_init: /opt/ebsofts/Mamba/23.1.0-4/etc/profile.d/conda.sh

path_conventions:
  output_root: outputs
  log_root: outputs/<exp_id>/logs
  report_root: outputs/<exp_id>/metrics
  checkpoint_subdir: checkpoints

cli_review:
  mode: independent_parallel_cli
  retry_failed_once: true
  min_successful_reviewers: 2
  timeout_seconds: 1800
  output_root: /tmp/tri_review
  quorum_policy: "3_success_normal; 2_success_degraded; 1_single_review_continuation_for_reversible_nonclaim_only; 0_stop"
  reviewers:
    - id: A
      label: claude
      model_family: anthropic
      cmd: claude
      stdin: true
      command_template: 'cat {prompt_file} | claude -p "Follow the full-scope research review prompt provided on stdin exactly. Produce the required structured review."'
      output_file: output_a_claude.md
      purpose: "Full-scope independent review: fairness, comparability, reproducibility, architecture, next SOTA step"
    - id: B
      label: codex
      model_family: openai
      cmd: codex
      stdin: true
      command_template: 'codex exec --sandbox read-only --skip-git-repo-check - < {prompt_file}'
      output_file: output_b_codex.md
      purpose: "Full-scope independent review: fairness, comparability, reproducibility, architecture, next SOTA step"
    - id: C
      label: antigravity
      model_family: google
      cmd: antigravity
      stdin: true
      command_template: 'bash .claude/skills/tri-review/scripts/reviewer_c_antigravity.sh {prompt_file}'
      backend_env: ANTIGRAVITY_CLI
      fallback_cmd: 'cursor-agent -p --output-format text'
      output_file: output_c_antigravity.md
      purpose: "Full-scope independent review; auxiliary diversity reviewer"
