exp_id: M12A-FIXEDMODEL-CROSSSPECIES
profile: screen
purpose: >
  Publication-alignment fixed-model test for the calibrated M9-L12 mainline:
  train and validation-calibrate on Arabidopsis only, then evaluate Oryza/Rice as
  an unseen species without any rice-label parameter selection.
claim_status: non_claim_screen_until_sota_benchmark_frozen
source_contract: configs/m12_publication_panel.yaml
species:
  train:
    - arabidopsis_thaliana
  calibrate:
    - arabidopsis_thaliana
  test:
    - oryza_sativa
paths:
  arabidopsis_thaliana: data/m1_screen/arabidopsis_thaliana
  oryza_sativa: data/m1_screen/oryza_sativa
seeds: [0, 1, 2]
trainer: src.foundation_probe.train_unfreeze_backbone
calibrator: scripts/experiments/M11-L12-SPEC-CALIBRATION/calibrate_decode.py
config:
  unfreeze_layers: 12
  window: 2046
  sample_fraction: 0.3
  epochs: 4
  patience: 2
  batch_size: 4
  lr: 1.0e-3
  backbone_lr: 1.0e-5
  class_weighting: sqrt_inv
  loss: fp_aware
  fp_lambda: 1.0
  save_raw_scores: true
  split_species_policy:
    train_species_names: [arabidopsis_thaliana]
    val_species_names: [arabidopsis_thaliana]
    test_species_names: [oryza_sativa]
  calibration:
    val_species: [arabidopsis_thaliana]
    test_species: [oryza_sativa]
    intergenic_biases: [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0]
    min_cds_lens: [60, 90, 120]
    max_fill_gaps: [0, 20]
    target_fpr: 0.01
    min_gbf1: 0.70
    max_gene_count_ratio: 1.25
outputs:
  root_template: outputs/M12A-FIXEDMODEL-CROSSSPECIES-A2R-s{seed}
  raw_scores:
    val: raw_scores/val_arabidopsis_thaliana.npz
    test: raw_scores/test_oryza_sativa.npz
  calibration: calibration/selected.json
  metrics: metrics/metrics.json
  validate: metrics/validate_goal.json
interpretation:
  success: >
    Fixed-model cross-species evidence: no rice labels are used for training,
    early stopping, or decode/FPR parameter selection.
  failure: >
    A good same-panel M11 but poor M12A result would mean the current model is
    mainly within-panel adaptation, not a fixed cross-species gene annotator.
