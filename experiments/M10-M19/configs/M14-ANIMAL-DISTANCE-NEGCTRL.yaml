exp_id: M14-ANIMAL-DISTANCE-NEGCTRL
profile: screen
purpose: >
  Bounded non-claim animal-distance diagnostic run in parallel with M13. Train and
  validation-calibrate the calibrated M9-L12/NT-v2 route on Arabidopsis only, then
  test two animal species as negative controls without any test-label tuning.
claim_status: non_claim_diagnostic_only
relationship_to_m13: >
  M13 tests close-plant and rice distance. M14 tests whether the same fixed
  Arabidopsis-only model fails catastrophically on two animals, helping separate
  near-clade transfer from broad-eukaryote fixed-model claims.
species:
  train:
    - arabidopsis_thaliana
  calibrate:
    - arabidopsis_thaliana
  test:
    - gallus_gallus
    - drosophila_melanogaster
paths:
  arabidopsis_thaliana: data/m1_screen/arabidopsis_thaliana
  gallus_gallus: data/m1_screen/gallus_gallus
  drosophila_melanogaster: data/m1_screen/drosophila_melanogaster
seed: 0
trainer: src.foundation_probe.train_unfreeze_backbone
calibrator: scripts/experiments/M11-L12-SPEC-CALIBRATION/calibrate_decode.py
config:
  unfreeze_layers: 12
  window: 2046
  sample_fraction: 0.3
  epochs: 4
  patience: 2
  batch_size: 4
  lr: 1.0e-3
  backbone_lr: 1.0e-5
  class_weighting: sqrt_inv
  loss: fp_aware
  fp_lambda: 1.0
  save_raw_scores: true
  split_species_policy:
    train_species_names: [arabidopsis_thaliana]
    val_species_names: [arabidopsis_thaliana]
    test_species_names: [gallus_gallus, drosophila_melanogaster]
  calibration:
    val_species: [arabidopsis_thaliana]
    test_species: [gallus_gallus, drosophila_melanogaster]
    intergenic_biases: [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0]
    min_cds_lens: [60, 90, 120]
    max_fill_gaps: [0, 20]
    target_fpr: 0.01
    min_gbf1: 0.50
    max_gene_count_ratio: 1.25
caveats:
  - Diagnostic-only: animal species are not clean final-claim evidence for the NT-v2 route.
  - Drosophila has many small seqids; runtime and GFF size may be larger than the plant scan.
  - Failure on animals should not by itself abandon plant/near-clade transfer.
outputs:
  root: outputs/M14-ANIMAL-DISTANCE-NEGCTRL-s0
  metrics: metrics/metrics.json
  calibration: calibration/selected.json
