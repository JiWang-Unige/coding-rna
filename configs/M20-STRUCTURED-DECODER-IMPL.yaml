outputs:
  root: outputs/M20-STRUCTURED-DECODER-IMPL-SMOKE3
  metrics: outputs/M20-STRUCTURED-DECODER-IMPL-SMOKE3/metrics/metrics.json
claim_status: smoke_only_not_claim
